groups:
  - name: orderflow_alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(orderflow_http_errors_total[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "The OrderFlow API is experiencing more than 0.5 errors per second over the last 5 minutes, indicating an unusually high rate of failures."

      - alert: HighPendingOrders
        expr: orderflow_orders_pending > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of pending orders"
          description: "More than 50 orders have been Pending for over 5 minutes. Pending orders hold reserved stock until an admin completes them or the expiration job cancels them; check the admin workflow and the expiration worker."

      - alert: OutboxBacklogGrowing
        expr: orderflow_outbox_pending > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog is growing"
          description: "More than 100 outbox messages have been waiting for over 5 minutes. The outbox processor may be failing or Redis may be unavailable (cache invalidation is part of message handling)."

      - alert: OutboxDeadLetters
        expr: orderflow_outbox_dead_letter_backlog > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Outbox dead letters present"
          description: "Outbox messages exceeded their retry budget. Inspect GET /api/admin/outbox/dead-letters and requeue after fixing the cause."

      - alert: BackgroundWorkerFailures
        expr: sum(increase(orderflow_worker_failures_total[10m])) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Background worker is failing repeatedly"
          description: "A background worker iteration failed more than 3 times in 10 minutes. Check the API logs."

      - alert: CacheErrors
        expr: sum(rate(orderflow_cache_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis cache errors"
          description: "Redis operations are failing; the API falls back to SQL Server but latency will increase."
